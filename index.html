.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.05);transition:opacity 1.6s ease;animation:drift 24s ease-in-out infinite alternate;will-change:transform}
.stage video.on{opacity:.9}
@keyframes drift{to{transform:scale(1.14) translate(-1%,-.8%)}}
.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,.58) 0%,rgba(0,0,0,.84) 100%)}

/* Conteúdo */
.content{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3vw,40px);
  padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));text-align:center}
.mark{--fs:clamp(70px,8.6vw,160px);margin:0 0 calc(var(--fs)*.22);display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;column-gap:.12em;line-height:.9;font-weight:400}
.frame{font-family:var(--f-frame);font-weight:400;text-transform:uppercase;font-size:var(--fs);line-height:.86;letter-spacing:.005em;color:var(--orange);animation:frameIn 1.1s var(--ease) .15s backwards}
.studio{font-family:var(--f-script);font-size:calc(var(--fs)*.52);line-height:1;color:var(--text);margin-bottom:-.08em;padding:0 .12em;animation:wipe 1.5s var(--ease) 1s backwards;white-space:nowrap}
@keyframes frameIn{from{opacity:0;transform:translateY(28px);letter-spacing:.08em;filter:blur(10px)}}
@keyframes wipe{from{clip-path:inset(-30% 100% -30% -5%);opacity:.2}to{clip-path:inset(-30% -5% -30% -5%)}}
@media(max-width:639px){.mark{--fs:clamp(96px,27vw,150px);flex-direction:column;align-items:center}.studio{font-size:calc(var(--fs)*.6);margin-top:calc(var(--fs)*.2);margin-bottom:0}}

.btn{display:inline-flex;gap:12px;align-items:center;justify-content:center;min-width:min(86vw,325px);padding:15px 32px;border:1px solid var(--orange);color:var(--orange);font-family:var(--f-ui);font-weight:700;font-size:19px;letter-spacing:.03em;text-decoration:none;background:linear-gradient(var(--orange),var(--orange)) no-repeat left center/0% 100%;transition:background-size .5s var(--ease),color .3s,transform .3s var(--ease);animation:btnIn 1s var(--ease) 2s backwards}
.btn:hover,.btn:focus-visible{background-size:100% 100%;color:#111;transform:translateY(-3px)}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:4px}
@keyframes btnIn{from{opacity:0;transform:translateY(18px)}}

/* Ícone de diafragma do botão */
.shut{width:26px;height:26px;flex:none;overflow:visible}
.shut circle,.shut path{fill:none;stroke:currentColor;stroke-width:6;stroke-linejoin:miter;stroke-linecap:butt}
/* Saída suave para o portfólio */

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01ms!important}.panel video{transform:none}}

/* botão em formato de visor de câmera */
.btn{border:none;border-radius:0;color:#fff;background-color:transparent;background-image:linear-gradient(var(--orange),var(--orange)),linear-gradient(var(--orange),var(--orange)),linear-gradient(var(--orange),var(--orange)),linear-gradient(var(--orange),var(--orange)),linear-gradient(var(--orange),var(--orange)),linear-gradient(var(--orange),var(--orange)),linear-gradient(var(--orange),var(--orange)),linear-gradient(var(--orange),var(--orange)),linear-gradient(var(--orange),var(--orange));background-repeat:no-repeat;background-position:left center,0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%;background-size:0% 100%,16px 2px,2px 16px,16px 2px,2px 16px,16px 2px,2px 16px,16px 2px,2px 16px;padding:19px 38px;transition:background-size .5s var(--ease),color .3s,transform .3s var(--ease)}
.btn:after{display:none}
.btn:hover,.btn:focus-visible{color:#111;background-image:linear-gradient(var(--orange),var(--orange)),linear-gradient(var(--orange),var(--orange)),linear-gradient(var(--orange),var(--orange)),linear-gradient(var(--orange),var(--orange)),linear-gradient(var(--orange),var(--orange)),linear-gradient(var(--orange),var(--orange)),linear-gradient(var(--orange),var(--orange)),linear-gradient(var(--orange),var(--orange)),linear-gradient(var(--orange),var(--orange));background-repeat:no-repeat;background-position:left center,0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%;background-size:100% 100%,16px 2px,2px 16px,16px 2px,2px 16px,16px 2px,2px 16px,16px 2px,2px 16px;transform:translateY(-3px)}

/* frase de apoio e atalho */
.tag{margin:0;font-size:clamp(11px,1.15vw,14px);letter-spacing:.32em;text-transform:uppercase;color:rgba(247,245,241,.78);animation:btnIn 1s var(--ease) 1.6s backwards}
.mark{margin-bottom:calc(var(--fs)*.08)}
.quick{position:fixed;z-index:3;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:22px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;animation:btnIn 1s var(--ease) 2.4s backwards}
.quick a{color:rgba(247,245,241,.7);text-decoration:none;padding:6px 2px;background:linear-gradient(var(--orange),var(--orange)) left bottom/0 1px no-repeat;transition:color .25s,background-size .35s var(--ease)}
.quick a:hover,.quick a:focus-visible{color:#fff;background-size:100% 1px}
.quick span{color:rgba(247,245,241,.3);padding:6px 0}
@media(max-width:639px){.tag{letter-spacing:.2em;max-width:280px;line-height:1.7}.quick{gap:14px;font-size:11px}}
</style>
</head>
<body>
<div class="stage" aria-hidden="true"><video id="bg" muted loop playsinline preload="auto" tabindex="-1"></video></div>
<div class="shade" aria-hidden="true"></div>
<main class="content">
  <h1 class="mark" aria-label="Frame Studio"><span class="frame" aria-hidden="true">Frame</span><span class="studio" aria-hidden="true">Studio</span></h1>
  <p class="tag">Vídeos para marcas e negócios</p>
  <a class="btn" id="enter" href="portfolio.html"><svg class="shut" viewBox="-50 -50 100 100" aria-hidden="true"><circle r="45"/><path id="blades"/></svg><span>Portfólio</span></a>
</main>
<nav class="quick" aria-label="Contato"><a href="https://ig.me/m/rafael.frame" target="_blank" rel="noopener">Fazer orçamento ↗</a><span aria-hidden="true">·</span><a href="https://www.instagram.com/rafael.frame/" target="_blank" rel="noopener">@rafael.frame</a></nav>
<svg id="iris" viewBox="-100 -100 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position:fixed;inset:0;width:100%;height:100%;z-index:99999;pointer-events:none;display:none"><path id="irisDark" fill="#000" fill-rule="evenodd" d="M-300 -300H300V300H-300Z"/><path id="irisSeam" fill="none" stroke="rgba(255,255,255,.13)" stroke-width=".35"/></svg>
<script>
(function(){
  var bg=document.getElementById('bg'),cur='';
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches||(navigator.connection&&navigator.connection.saveData);
  // Computador usa o vídeo horizontal, celular em pé usa o vertical
  function load(){
    var src='fundo-bokeh.mp4';
    if(src===cur) return; cur=src;
    bg.classList.remove('on'); bg.muted=true; bg.src=src; bg.load();
    if(!still) bg.play().catch(function(){});
  }
  bg.addEventListener('loadeddata',function(){ bg.classList.add('on'); });
  load();

  // Baixa o portfólio em segundo plano enquanto a pessoa olha a tela de entrada
  (function(){
    if(navigator.connection&&navigator.connection.saveData) return;
    function pre(){['portfolio.html','fundo-lente.mp4'].forEach(function(h){var l=document.createElement('link');l.rel='prefetch';l.href=h;document.head.appendChild(l);});}
    window.addEventListener('load',function(){(window.requestIdleCallback||function(f){setTimeout(f,1200)})(pre);});
  })();
  var t; window.addEventListener('resize',function(){ clearTimeout(t); t=setTimeout(load,250); });
  // Ícone do diafragma: abre ao passar o mouse e "bate" uma vez quando o botão aparece
  function hex(r,phi){var Rv=r/Math.cos(Math.PI/6),p=[];for(var k=0;k<6;k++){var a=phi+k*Math.PI/3;p.push([Rv*Math.cos(a),Rv*Math.sin(a)]);}return p;}
  function irisPath(r,phi){var p=hex(r,phi),d='M-300 -300H300V300H-300Z M'+p.map(function(q){return q[0].toFixed(2)+' '+q[1].toFixed(2);}).join('L')+'Z',s='';
    for(var k=0;k<6;k++){var a=p[k],b=p[(k+1)%6],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy);if(!l)continue;dx/=l;dy/=l;s+='M'+b[0].toFixed(2)+' '+b[1].toFixed(2)+'L'+(b[0]+dx*400).toFixed(2)+' '+(b[1]+dy*400).toFixed(2);}
    return [d,s];}
  function runIris(from,to,phiFrom,phiTo,ms,done){var dark=document.getElementById('irisDark'),seam=document.getElementById('irisSeam'),t0=performance.now();
    (function f(t){var u=Math.min(1,(t-t0)/ms),e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,pp=irisPath(from+(to-from)*e,phiFrom+(phiTo-phiFrom)*e);dark.setAttribute('d',pp[0]);seam.setAttribute('d',pp[1]);if(u<1)requestAnimationFrame(f);else if(done)done();})(t0);}
  var blades=document.getElementById('blades');
  function drawIcon(r,phi){var p=hex(r,phi),d='';for(var k=0;k<6;k++){var a=p[k],b=p[(k+1)%6],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
      var pd=b[0]*dx+b[1]*dy,c=b[0]*b[0]+b[1]*b[1]-45*45,tt=-pd+Math.sqrt(Math.max(0,pd*pd-c));
      d+='M'+a[0].toFixed(2)+' '+a[1].toFixed(2)+'L'+(b[0]+dx*tt).toFixed(2)+' '+(b[1]+dy*tt).toFixed(2);}
    blades.setAttribute('d',d);}
  var cur={r:9,phi:0},raf;
  function tweenTo(r,phi,ms){cancelAnimationFrame(raf);var s0={r:cur.r,phi:cur.phi},t0=performance.now();
    (function f(t){var u=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-u,3);cur.r=s0.r+(r-s0.r)*e;cur.phi=s0.phi+(phi-s0.phi)*e;drawIcon(cur.r,cur.phi);if(u<1)raf=requestAnimationFrame(f);})(t0);}
  drawIcon(cur.r,cur.phi);
  var a=document.getElementById('enter');
  ['pointerenter','focus'].forEach(function(ev){ a.addEventListener(ev,function(){ tweenTo(27,Math.PI/6,450); }); });
  ['pointerleave','blur'].forEach(function(ev){ a.addEventListener(ev,function(){ tweenTo(9,0,450); }); });
  if(!still) setTimeout(function(){ tweenTo(26,Math.PI/6,240); setTimeout(function(){ tweenTo(9,0,420); },380); },2900);

  // Som de disparo (respeita a escolha do botão SFX do portfólio)
  function shutterSound(delay){
    try{ if(localStorage.getItem('rf-sfx')==='off') return; }catch(e){}
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    try{
      var c=new AC(),m=c.createGain(),nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0),i,t=c.currentTime+delay;
      for(i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      m.gain.value=.55; m.connect(c.destination); var rs=c.resume&&c.resume(); if(rs&&rs.catch) rs.catch(function(){});
      function env(g,t0,pk,at,de){g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(pk,t0+at);g.gain.exponentialRampToValueAtTime(.0001,t0+at+de);}
      function osc(ty,f0,f1,t0,at,de,pk){var o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.setValueAtTime(f0,t0);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t0+at+de);env(g,t0,pk,at,de);o.connect(g);g.connect(m);o.start(t0);o.stop(t0+at+de+.05);}
      function hiss(ty,f0,f1,q,t0,at,de,pk){var s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=nb;f.type=ty;f.Q.value=q;f.frequency.setValueAtTime(f0,t0);if(f1!==f0)f.frequency.exponentialRampToValueAtTime(f1,t0+at+de);env(g,t0,pk,at,de);s.connect(f);f.connect(g);g.connect(m);s.start(t0);s.stop(t0+at+de+.05);}
      hiss('highpass',2500,2500,.7,t,.002,.03,.3); osc('square',210,90,t,.002,.04,.07);
      hiss('lowpass',1400,700,.8,t+.075,.003,.06,.32); osc('sine',140,60,t+.075,.003,.08,.2);
    }catch(e){}
  }
  // Ao clicar: a tela fecha como um obturador e abre o portfólio
  var iris=document.getElementById('iris'),going=false;
  a.addEventListener('click',function(e){
    if(e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||going) return;
    e.preventDefault(); going=true;
    var href=a.getAttribute('href');
    if(still){ location.href=href; return; }
    try{ sessionStorage.setItem('rf-iris','1'); }catch(err){}
    iris.style.display='block';
    shutterSound(.28); runIris(150,0,0,.75,780,function(){ location.href=href; });
  });
  window.addEventListener('pageshow',function(e){ if(e.persisted){ going=false; iris.style.display='none'; } });
})();
</script>
</body>
</html>
